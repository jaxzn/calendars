name: Update football calendars

on:
  schedule:
    - cron: "0 10 * * *"               # daily, 10:00 UTC
    - cron: "0 */6 * 9-12,1-2 0,1,4"   # every 6h on Sun/Mon/Thu (UTC), Sep-Feb
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-calendars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate calendars
        run: python3 football/generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update football calendars ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
