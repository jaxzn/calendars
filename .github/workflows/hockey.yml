name: Update hockey calendars

on:
  schedule:
    - cron: "0 12 * * *"   # daily 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendars   # shared with football, basketball, and baseball so the jobs never push at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate calendars
        run: python3 hockey/generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update hockey calendars ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
